<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — Woodbuyy</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="WOODBUYY_BRAND.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="account.css">
    <link rel="stylesheet" href="wishlist.css">
</head>
<body>

    <!-- Account Layout -->
    <div class="account-layout">
        
        <!-- Sidebar -->
        <aside class="account-sidebar">
            <div class="account-sidebar-header">
                <a href="index.html" class="account-logo">Woodbuyy</a>
            </div>
            
            <nav class="account-nav">
                <a href="account.html" class="account-nav-item">
                    <i class="ri-dashboard-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="orders.html" class="account-nav-item">
                    <i class="ri-shopping-bag-line"></i>
                    <span>My Orders</span>
                </a>
                <a href="wishlist.html" class="account-nav-item active">
                    <i class="ri-heart-line"></i>
                    <span>Wishlist</span>
                </a>
                <a href="addresses.html" class="account-nav-item">
                    <i class="ri-map-pin-line"></i>
                    <span>Addresses</span>
                </a>
                <a href="profile.html" class="account-nav-item">
                    <i class="ri-user-settings-line"></i>
                    <span>Profile Settings</span>
                </a>
            </nav>
            
            <div class="account-sidebar-footer">
                <a href="index.html" class="account-nav-item">
                    <i class="ri-store-2-line"></i>
                    <span>Continue Shopping</span>
                </a>
                <button class="account-nav-item logout-btn" id="logoutBtn">
                    <i class="ri-logout-box-line"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="account-main">
            
            <!-- Top Bar -->
            <div class="account-topbar">
                <h1 class="account-page-title">My Wishlist</h1>
            </div>
            
            <!-- Wishlist Grid -->
            <div id="wishlistGrid" class="wishlist-grid">
                <!-- Wishlist items will be loaded here -->
                <div class="wishlist-loading">
                    <i class="ri-loader-4-line ri-spin"></i>
                    <span>Loading wishlist...</span>
                </div>
            </div>
            
        </main>
        
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="firebase-config.js"></script>
    <script src="ui.js"></script>
    <script src="auth.js"></script>
    <script src="wishlist.js"></script>
</body>
</html>
