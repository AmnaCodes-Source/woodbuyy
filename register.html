<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Woodbuyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <style>
    body { font-family: 'Jost', sans-serif; background: #0D0D0D; color: #F5F0E8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; margin: 0; }
    .auth-card { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 6px; padding: 40px; width: 100%; max-width: 420px; }
    .logo { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 700; font-size: 28px; text-align: center; }
    .tag { text-align: center; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #C9A96E; margin: 5px 0 25px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; text-align: center; }
    .subtitle { text-align: center; color: #6E6860; font-size: 14px; margin: 8px 0 25px; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6E6860; margin-bottom: 6px; }
    input { width: 100%; height: 45px; background: #141414; border: 1px solid #2E2E2E; border-radius: 4px; color: #F5F0E8; padding: 0 12px; font-size: 14px; outline: none; }
    input:focus { border-color: #C9A96E; }
    .btn { width: 100%; height: 48px; background: #C9A96E; color: #0D0D0D; border: none; border-radius: 2px; font-size: 13px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .links { text-align: center; margin-top: 20px; font-size: 14px; color: #6E6860; }
    .links a { color: #C9A96E; text-decoration: none; }
    .error { background: rgba(224,85,85,0.1); color: #E05555; padding: 10px; border-radius: 4px; font-size: 13px; text-align: center; margin-top: 15px; display: none; }
    .success { background: rgba(76,175,125,0.1); color: #4CAF7D; padding: 20px; border-radius: 4px; font-size: 14px; text-align: center; margin-top: 15px; display: none; line-height: 1.7; }
    .success .highlight { background: rgba(201,169,110,0.2); color: #C9A96E; padding: 6px 12px; border-radius: 4px; display: inline-block; margin: 8px 0; font-weight: 500; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo">Woodbuyy</div>
    <div class="tag">Customer Registration</div>
    <h1>Create Account</h1>
    <p class="subtitle">Join Woodbuyy for a better experience</p>

    <form id="register-form">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="input-group">
        <label>Phone</label>
        <input type="tel" id="phone" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <button type="submit" class="btn" id="register-btn">Create Account</button>
      <div class="error" id="error-msg"></div>
      <div class="success" id="success-msg"></div>
    </form>

    <div class="links">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const registerBtn = document.getElementById('register-btn');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      // Validation
      if (!name || !phone || !email || !password) {
        errorMsg.textContent = 'Please fill all fields';
        errorMsg.style.display = 'block';
        return;
      }
      
      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters';
        errorMsg.style.display = 'block';
        return;
      }
      
      // Loading state
      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating Account...';
      
      try {
        // Create user
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const user = cred.user;
        
        // Send email verification (non-blocking)
        try {
          await user.sendEmailVerification();
        } catch (emailErr) {
          console.warn('[register] Email verification failed:', emailErr);
          // Continue even if email fails
        }
        
        // Update display name
        try {
          await user.updateProfile({ displayName: name });
        } catch (profileErr) {
          console.warn('[register] Profile update failed:', profileErr);
        }
        
        // Save to Firestore
        await db.collection('users').doc(user.uid).set({
          name: name,
          phone: phone,
          email: email,
          role: 'customer',
          isGuest: false,
          emailVerified: false,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Show success message with spam folder warning
        successMsg.innerHTML = `
          <strong style="font-size:16px;">✅ Account created successfully!</strong><br><br>
          
          We've sent a verification email to:<br>
          <strong>${email}</strong><br><br>
          
          <span class="highlight">📧 Check your INBOX and SPAM folder</span><br><br>
          
          <a href="account.html" style="color:#C9A96E;font-weight:500;">Continue to Account →</a>
        `;
        successMsg.style.display = 'block';
        
        // Clear form
        document.getElementById('register-form').reset();
        
        // Redirect after 6 seconds
        setTimeout(() => {
          window.location.href = 'account.html';
        }, 6000);
        
      } catch (err) {
        console.error('[register] Error:', err);
        
        let message = 'Registration failed. Please try again.';
        
        switch (err.code) {
          case 'auth/email-already-in-use':
            message = 'This email is already registered. Please login instead.';
            break;
          case 'auth/invalid-email':
            message = 'Invalid email address.';
            break;
          case 'auth/weak-password':
            message = 'Password is too weak. Please use at least 6 characters.';
            break;
          case 'auth/network-request-failed':
            message = 'Network error. Please check your internet connection.';
            break;
          default:
            message = err.message;
        }
        
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
      }
    });
  </script>

</body>
</html>
