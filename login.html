<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Woodbuyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Jost', sans-serif;
      background: #0D0D0D;
      color: #F5F0E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #1C1C1C;
      border: 1px solid #2E2E2E;
      border-radius: 6px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 700;
      font-size: 28px;
      text-align: center;
      margin-bottom: 5px;
    }
    .tag {
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 30px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #6E6860;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6E6860;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      height: 48px;
      background: #141414;
      border: 1px solid #2E2E2E;
      border-radius: 4px;
      color: #F5F0E8;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #C9A96E;
    }
    .btn {
      width: 100%;
      height: 48px;
      background: #C9A96E;
      color: #0D0D0D;
      border: none;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: #B8944F;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #6E6860;
    }
    .links a {
      color: #C9A96E;
      text-decoration: none;
    }
    .error {
      background: rgba(224,85,85,0.1);
      color: #E05555;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo">Woodbuyy</div>
    <div class="tag">Customer Login</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to your account</p>

    <form id="login-form">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@email.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="error" id="error-msg"></div>
    </form>

    <div class="links">
      <a href="#">Forgot password?</a><br>
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      errorMsg.style.display = 'none';

      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'account.html';
      } catch (err) {
        const messages = {
          'auth/user-not-found': 'No account found with this email.',
          'auth/wrong-password': 'Incorrect password.',
          'auth/invalid-email': 'Invalid email address.'
        };
        errorMsg.textContent = messages[err.code] || 'Login failed. Try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>

</body>
</html>
