<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category — Woodbuyy UAE</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar__inner">
      <button class="navbar__toggle" id="navbar-toggle" aria-label="Menu"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="categories.html" class="navbar__link">Categories</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="contact.html" class="navbar__link">Contact</a>
        <a href="custom-quote.html" class="navbar__link">Custom Quote</a>
      </nav>
      <div class="navbar__actions">
        <a href="account-wishlist.html" class="navbar__icon" aria-label="Wishlist">
          <i class="ri-heart-line"></i>
          <span class="navbar__badge hidden" data-wishlist-count>0</span>
        </a>
        <a href="cart.html" class="navbar__icon" aria-label="Cart">
          <i class="ri-shopping-bag-line"></i>
          <span class="navbar__badge hidden" data-cart-count>0</span>
        </a>
        <a href="account.html" class="navbar__icon" aria-label="Account"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <main class="category-page">
    <div class="container">
      <div class="category-header">
        <p class="section-eyebrow">Collection</p>
        <h1 class="section-title" id="category-title">Loading...</h1>
      </div>
      <div class="products-grid" id="products-grid"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__brand">Woodbuyy</p>
      <p class="footer__tagline">Luxury furniture for the modern UAE home.</p>
      <p class="footer__copyright">© 2026 Woodbuyy. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const grid = document.getElementById('products-grid');

    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    async function loadCategory() {
      if (!slug) {
        window.location.href = 'categories.html';
        return;
      }

      try {
        const catSnap = await db.collection('categories')
          .where('slug', '==', slug)
          .limit(1)
          .get();
          
        if (catSnap.empty) {
          document.getElementById('category-title').textContent = 'Category Not Found';
          return;
        }
        
        const category = catSnap.docs[0].data();
        document.getElementById('category-title').textContent = category.name;

        const prodSnap = await db.collection('Products')
          .where('categorySlug', '==', slug)
          .limit(20)
          .get();

        if (prodSnap.empty) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state__icon">
                <i class="ri-sofa-line"></i>
              </div>
              <h3 class="empty-state__title">No products in this category yet</h3>
              <p class="empty-state__text">Check back soon for new arrivals.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = prodSnap.docs.map(doc => {
          const p = doc.data();
          const img = p.images && p.images.length > 0 ? p.images[0] : 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600';
          const price = p.salePrice || p.price || 0;
          return `
            <a href="product.html?id=${doc.id}" class="product-card">
              <img src="${img}" alt="${escapeHTML(p.name)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600'">
              <div class="product-card__body">
                <p class="product-card__name">${escapeHTML(p.name)}</p>
                <p class="product-card__price">${formatCurrency(price)}</p>
              </div>
            </a>
          `;
        }).join('');
        
      } catch (err) {
        console.error('[category.html] Error:', err);
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state__icon">
              <i class="ri-error-warning-line"></i>
            </div>
            <h3 class="empty-state__title">Failed to load products</h3>
            <p class="empty-state__text">Please try again later.</p>
          </div>
        `;
      }
    }

    loadCategory();
  </script>

</body>
</html>
