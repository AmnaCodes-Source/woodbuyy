<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Woodbuyy</title>
  <meta name="description" content="Premium furniture, delivered across the UAE. Cash on delivery.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/product.css">
</head>
<body>

  <header id="navbar"></header>

  <main class="product-page">
    <div class="container">

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a>
        <i class="ri-arrow-right-s-line"></i>
        <a href="/products.html">Products</a>
        <i class="ri-arrow-right-s-line"></i>
        <span id="breadcrumbName">Product</span>
      </nav>

      <div class="product-layout">

        <section class="product-gallery" aria-label="Product images">

          <div class="product-gallery__stage">
            <button class="product-gallery__nav product-gallery__nav--prev" id="galleryPrev" aria-label="Previous image" type="button">
              <i class="ri-arrow-left-line"></i>
            </button>

            <div class="product-gallery__frame">
              <div class="skeleton product-gallery__skeleton" id="gallerySkeleton"></div>
              <img id="mainImage" class="product-gallery__image" alt="" loading="eager" decoding="async">
              <span class="product-gallery__badge" id="galleryBadge"></span>
            </div>

            <button class="product-gallery__nav product-gallery__nav--next" id="galleryNext" aria-label="Next image" type="button">
              <i class="ri-arrow-right-line"></i>
            </button>
          </div>

          <div class="product-gallery__thumbs" id="thumbStrip"></div>

        </section>

        <section class="product-info" aria-label="Product details">

          <p class="product-info__eyebrow label" id="productCategory">Category</p>

          <h1 class="product-info__title" id="productName">Product Name</h1>

          <p class="product-info__sku" id="productSku"></p>

          <p class="product-info__subtitle" id="productSubtitle"></p>

          <div class="product-info__rating">
            <span class="product-info__stars" id="productStars" aria-label="Rating"></span>
            <span class="product-info__reviews" id="productReviews">0 reviews</span>
          </div>

          <div class="product-info__price">
            <span class="product-info__price-current" id="productPrice">AED 0.00</span>
            <span class="product-info__price-original" id="productPriceOriginal"></span>
            <span class="product-info__price-save" id="productSave"></span>
          </div>

          <p class="product-info__dimline" id="productDimLine"></p>

          <div class="product-info__attr" id="colorGroup">
            <span class="label">Colour</span>
            <div class="swatch-row" id="colorSwatches"></div>
          </div>

          <div class="product-info__attr" id="materialGroup">
            <span class="label">Material</span>
            <select class="input" id="materialSelect">
              <option value="">Select material</option>
            </select>
          </div>

          <div class="product-info__qty">
            <span class="label">Quantity</span>
            <div class="qty-stepper">
              <button type="button" id="qtyMinus" aria-label="Decrease quantity">-</button>
              <input type="number" id="qtyInput" value="1" min="1" max="99" inputmode="numeric">
              <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <div class="product-info__ctas">
            <button type="button" class="btn btn--primary btn--full" id="addToCartBtn">
              <i class="ri-shopping-bag-3-line"></i>
              <span>Add to Cart</span>
            </button>
            <button type="button" class="btn btn--secondary btn--full" id="buyNowBtn">
              <i class="ri-flashlight-line"></i>
              <span>Buy Now - COD</span>
            </button>
            <button type="button" class="btn btn--ghost btn--full" id="enquiryBtn">
              <i class="ri-mail-send-line"></i>
              <span>Product Enquiry</span>
            </button>
          </div>

          <ul class="product-info__trust">
            <li><i class="ri-truck-line"></i><span>Free delivery over AED 2,000</span></li>
            <li><i class="ri-shield-check-line"></i><span>1-year warranty</span></li>
            <li><i class="ri-arrow-go-back-line"></i><span>7-day returns</span></li>
            <li><i class="ri-money-dollar-circle-line"></i><span>Cash on Delivery</span></li>
          </ul>

        </section>

      </div>

    </div>
  </main>

  <footer id="footer"></footer>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/product.js"></script>

</body>
</html>
