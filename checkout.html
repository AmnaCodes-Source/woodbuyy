<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Checkout — Woodbuyy UAE | Cash on Delivery</title>
<meta name="description" content="Complete your order at Woodbuyy. Cash on delivery across all 7 Emirates. 5% VAT included. Premium furniture delivered to your door.">
<meta name="keywords" content="checkout, COD furniture UAE, cash on delivery, buy furniture Dubai">
<meta property="og:title" content="Checkout — Woodbuyy UAE">
<meta property="og:description" content="Complete your order. Cash on delivery across UAE.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://amnacodes-source.github.io/woodbuyy/checkout.html">
<meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .checkout-page { padding-top: 72px; min-height: 100vh; }
    .checkout-header { padding: 40px 0 20px; text-align: center; }
    .checkout-layout { display: grid; grid-template-columns: 1fr; gap: 25px; padding-bottom: 60px; max-width: 800px; margin: 0 auto; }
    .form-section { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 4px; padding: 25px; margin-bottom: 20px; }
    .form-section h2 { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #F5F0E8; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6E6860; margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; height: 45px; background: #141414; border: 1px solid #2E2E2E; border-radius: 4px; color: #F5F0E8; padding: 0 12px; font-size: 14px; outline: none; }
    .input-group input:focus, .input-group select:focus { border-color: #C9A96E; }
    .btn-primary { width: 100%; height: 50px; background: #C9A96E; color: #0D0D0D; border: none; border-radius: 2px; font-size: 14px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .btn-primary:hover { background: #B8944F; }
    .btn-whatsapp { width: 100%; height: 50px; background: #25D366; color: #fff; border: none; border-radius: 2px; font-size: 14px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-top: 10px; display: none; }
    .btn-whatsapp:hover { background: #1EBE5A; }
    .order-summary { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 4px; padding: 20px; margin-top: 10px; display: none; }
    .order-summary h3 { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: #F5F0E8; margin-bottom: 10px; }
    .order-summary p { font-size: 13px; color: #B0A898; margin-bottom: 5px; }
    @media (min-width: 768px) { .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar__inner">
      <button class="navbar__toggle"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="cart.html" class="navbar__link">Cart</a>
      </nav>
      <div class="navbar__actions">
        <a href="account.html" class="navbar__icon"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <main class="checkout-page">
    <div class="container">
      <div class="checkout-header">
        <p style="font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#C9A96E;">Almost There</p>
        <h1 style="font-family:'Cormorant Garamond',serif;font-size:36px;color:#F5F0E8;margin-top:10px;">Checkout</h1>
      </div>
      <div class="checkout-layout">
        <form id="checkout-form">
          <div class="form-section">
            <h2>Contact Information</h2>
            <div class="form-row">
              <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" required>
              </div>
              <div class="input-group">
                <label>Phone</label>
                <input type="tel" id="phone" required>
              </div>
            </div>
            <div class="input-group">
              <label>Email</label>
              <input type="email" id="email" required>
            </div>
          </div>
          <div class="form-section">
            <h2>Delivery Address</h2>
            <div class="input-group">
              <label>Address Line 1</label>
              <input type="text" id="line1" required>
            </div>
            <div class="input-group">
              <label>Address Line 2 (optional)</label>
              <input type="text" id="line2">
            </div>
            <div class="form-row">
              <div class="input-group">
                <label>Emirate</label>
                <select id="emirate" required>
                  <option value="">Select...</option>
                  <option>Dubai</option>
                  <option>Abu Dhabi</option>
                  <option>Sharjah</option>
                  <option>Ajman</option>
                  <option>Ras Al Khaimah</option>
                  <option>Fujairah</option>
                  <option>Umm Al Quwain</option>
                </select>
              </div>
              <div class="input-group">
                <label>City</label>
                <input type="text" id="city">
              </div>
            </div>
          </div>
          <div class="form-section">
            <h2>Payment</h2>
            <p style="color:#B0A898;font-size:14px;">💵 Cash on Delivery — pay when your furniture arrives.</p>
          </div>
          <button type="submit" class="btn-primary">Place Order</button>
        </form>

        <!-- WhatsApp Confirmation -->
        <div class="order-summary" id="order-summary">
          <h3>✅ Order Placed Successfully!</h3>
          <p id="summary-order-id"></p>
          <p id="summary-total"></p>
          <p style="margin-top:10px;color:#6E6860;">Send order details to WhatsApp for faster confirmation:</p>
          <button type="button" class="btn-whatsapp" id="btn-whatsapp">
            <i class="ri-whatsapp-line"></i> Send Order on WhatsApp
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    // ============================================================
    // WOODBUYY ADMIN WHATSAPP NUMBER
    // Change this to your WhatsApp number (UAE format, no +)
    // ============================================================
    const ADMIN_WHATSAPP = '9715XXXXXXXX'; // ← APNA NUMBER YAHAN DALO

    // Format price
    function formatAED(fils) {
      return 'AED ' + (fils / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    // Generate Order ID
    function generateOrderId() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const rand = String(Math.floor(Math.random() * 9999) + 1).padStart(4, '0');
      return `WB-${yy}${mm}${dd}-${rand}`;
    }

    // Build WhatsApp message
    function buildWhatsAppMessage(orderData) {
      const itemsList = orderData.items.map(item =>
        `• ${item.name} x${item.quantity} = ${formatAED((item.salePrice || item.price) * item.quantity)}`
      ).join('\n');

      return [
        '🔔 *NEW ORDER — WOODBUYY*',
        '',
        `📋 Order ID: ${orderData.orderId}`,
        '',
        '👤 *Customer:*',
        `Name: ${orderData.customerName}`,
        `Phone: ${orderData.customerPhone}`,
        `Email: ${orderData.customerEmail}`,
        '',
        '📍 *Delivery Address:*',
        `${orderData.address.line1}${orderData.address.line2 ? ', ' + orderData.address.line2 : ''}`,
        `${orderData.address.emirate}${orderData.address.city ? ', ' + orderData.address.city : ''}`,
        '',
        '🛒 *Items:*',
        itemsList,
        '',
        '💰 *Total:*',
        `Subtotal: ${formatAED(orderData.subtotal)}`,
        `VAT (5%): ${formatAED(orderData.vat)}`,
        `Shipping: ${formatAED(orderData.shipping)}`,
        `*TOTAL: ${formatAED(orderData.total)}*`,
        '',
        '💵 Payment: Cash on Delivery'
      ].join('\n');
    }

    document.getElementById('checkout-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const cart = JSON.parse(localStorage.getItem('wb_cart') || '[]');
      if (cart.length === 0) {
        alert('Cart is empty');
        return;
      }

      const subtotal = cart.reduce((sum, item) => sum + ((item.salePrice || item.price) * item.quantity), 0);
      const vat = Math.round(subtotal * 0.05);
      const shipping = 5000;
      const total = subtotal + vat + shipping;

      const orderId = generateOrderId();

      const orderData = {
        orderId,
        customerName: document.getElementById('name').value,
        customerPhone: document.getElementById('phone').value,
        customerEmail: document.getElementById('email').value,
        items: cart,
        subtotal, vat, shipping, total,
        address: {
          line1: document.getElementById('line1').value,
          line2: document.getElementById('line2').value,
          emirate: document.getElementById('emirate').value,
          city: document.getElementById('city').value
        }
      };

      try {
        // Save order to Firestore
        await db.collection('orders').doc(orderId).set({
          customerName: orderData.customerName,
          customerPhone: orderData.customerPhone,
          customerEmail: orderData.customerEmail,
          items: cart,
          subtotal, vat, shipping, total,
          address: orderData.address,
          status: 'pending',
          paymentMethod: 'cod',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Clear cart
        localStorage.removeItem('wb_cart');

        // Hide form, show summary
        document.getElementById('checkout-form').style.display = 'none';
        document.getElementById('order-summary').style.display = 'block';
        document.getElementById('summary-order-id').textContent = 'Order ID: ' + orderId;
        document.getElementById('summary-total').textContent = 'Total: ' + formatAED(total);

        // Setup WhatsApp button
        const waMessage = buildWhatsAppMessage(orderData);
        const waUrl = 'https://wa.me/' + ADMIN_WHATSAPP + '?text=' + encodeURIComponent(waMessage);
        const btnWhatsApp = document.getElementById('btn-whatsapp');
        btnWhatsApp.style.display = 'flex';
        btnWhatsApp.onclick = () => window.open(waUrl, '_blank');

        // Auto-open WhatsApp after 1 second
        setTimeout(() => window.open(waUrl, '_blank'), 1000);

      } catch (err) {
        alert('Order failed: ' + err.message);
      }
    });
  </script>

</body>
</html>
