<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Woodbuyy Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html" class="active"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html"><i class="ri-folder-line"></i> Categories</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
      <a href="#" onclick="logout()" style="color:#E05555;"><i class="ri-logout-box-line"></i> Logout</a>
    </aside>
    <main class="main">
      <h1>Dashboard</h1>
      <div class="stats-grid" id="stats">
        <div class="stat-card"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-title"></div></div>
        <div class="stat-card"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-title"></div></div>
        <div class="stat-card"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-title"></div></div>
        <div class="stat-card"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-title"></div></div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script>
    function formatAED(fils) {
      return 'AED ' + (fils / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists || userDoc.data().role !== 'admin') { 
          window.location.href = 'login.html'; 
          return; 
        }
        
        const [ordersSnap, productsSnap, customersSnap] = await Promise.all([
          db.collection('orders').get(),
          db.collection('Products').get(),  // ← Capital P
          db.collection('users').where('role', '==', 'customer').get()
        ]);
        
        // Calculate revenue from orders
        let revenue = 0;
        let pendingOrders = 0;
        
        ordersSnap.forEach(doc => {
          const order = doc.data();
          if (order.status !== 'cancelled') {
            revenue += order.total || 0;
          }
          if (order.status === 'pending') {
            pendingOrders++;
          }
        });
        
        document.getElementById('stats').innerHTML = `
          <div class="stat-card">
            <p class="label">Total Orders</p>
            <p class="value">${ordersSnap.size}</p>
            <p class="meta">${pendingOrders} pending</p>
          </div>
          <div class="stat-card">
            <p class="label">Products</p>
            <p class="value">${productsSnap.size}</p>
          </div>
          <div class="stat-card">
            <p class="label">Customers</p>
            <p class="value">${customersSnap.size}</p>
          </div>
          <div class="stat-card">
            <p class="label">Revenue</p>
            <p class="value">${formatAED(revenue)}</p>
          </div>
        `;
        
      } catch (err) {
        console.error('[admin/dashboard] Error:', err);
        document.getElementById('stats').innerHTML = `
          <div class="stat-card" style="grid-column:1/-1;">
            <p class="label">Error</p>
            <p class="value">Failed to load</p>
          </div>
        `;
      }
    });
    
    function logout() { 
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }
  </script>
</body>
</html>
