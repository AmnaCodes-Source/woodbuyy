<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Woodbuyy Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body { font-family: 'Jost', sans-serif; background: #0D0D0D; color: #F5F0E8; margin: 0; }
    .admin-layout { display: flex; min-height: 100vh; }
.sidebar { width: 250px; background: #141414; border-right: 1px solid #2E2E2E; padding: 20px; position: sticky; top: 0; height: 100vh; overflow-y: auto; flex-shrink: 0; }
    .sidebar .logo { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 24px; margin-bottom: 5px; }
    .sidebar .tag { font-size: 10px; letter-spacing: 2px; color: #C9A96E; text-transform: uppercase; margin-bottom: 30px; }
    .sidebar a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: #B0A898; text-decoration: none; font-size: 13px; border-radius: 4px; margin-bottom: 3px; white-space: nowrap;  }
    .sidebar a:hover, .sidebar a.active { background: #1C1C1C; color: #F5F0E8; }
  .main { flex: 1; padding: 30px; min-width: 0; }
    h1 { font-family: 'Cormorant Garamond', serif; }
    .stats-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .stat-card { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 4px; padding: 20px; }
    .stat-card .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6E6860; }
    .stat-card .value { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #C9A96E; margin-top: 5px; }
    .stat-card .value { font-family: 'Cormorant Garamond', serif; font-size: 32px; color: #C9A96E; margin-top: 5px; }
    @media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html" class="active"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html"><i class="ri-folder-line"></i> Categories</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
      <a href="#" onclick="logout()" style="color:#E05555;"><i class="ri-logout-box-line"></i> Logout</a>
    </aside>
    <main class="main">
      <h1>Dashboard</h1>
      <div class="stats-grid" id="stats"></div>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      const userDoc = await db.collection('users').doc(user.uid).get();
      if (!userDoc.exists || userDoc.data().role !== 'admin') { window.location.href = 'login.html'; return; }
      const [orders, products, customers] = await Promise.all([
        db.collection('orders').get(),
        db.collection('products').get(),
        db.collection('users').where('role', '==', 'customer').get()
      ]);
      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><p class="label">Orders</p><p class="value">${orders.size}</p></div>
        <div class="stat-card"><p class="label">Products</p><p class="value">${products.size}</p></div>
        <div class="stat-card"><p class="label">Customers</p><p class="value">${customers.size}</p></div>
        <div class="stat-card"><p class="label">Revenue</p><p class="value">AED 0</p></div>
      `;
    });
    function logout() { auth.signOut(); window.location.href = 'login.html'; }
  </script>
</body>
</html>
