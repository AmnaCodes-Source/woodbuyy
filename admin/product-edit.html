<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product — Woodbuyy Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- Mobile menu button -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
    <i class="ri-menu-line"></i>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
        <i class="ri-close-line"></i>
      </button>
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html" class="active"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html"><i class="ri-folder-line"></i> Categories</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
      <a href="#" onclick="logout()" style="color:#E05555;"><i class="ri-logout-box-line"></i> Logout</a>
    </aside>

    <main class="main">
      <h1>Edit Product</h1>

      <div class="card" style="padding:25px;max-width:600px;">
        <form id="edit-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" required>
          </div>

          <div class="form-group">
            <label>Slug</label>
            <input type="text" id="slug" required>
          </div>

          <div class="form-group">
            <label>Price (AED)</label>
            <input type="number" id="price" step="0.01" min="0" required>
          </div>

          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="stock" min="0">
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="save-btn">
            Update Product
          </button>
        </form>

        <button class="btn btn--danger btn--full" style="margin-top:15px;" onclick="deleteProduct()">
          <i class="ri-delete-bin-line"></i> Delete Product
        </button>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script>
    // ---------- MOBILE MENU ----------
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarClose = document.getElementById('sidebarClose');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.add('is-open');
        sidebarOverlay.classList.add('is-visible');
      });
    }

    if (sidebarClose) {
      sidebarClose.addEventListener('click', () => {
        sidebar.classList.remove('is-open');
        sidebarOverlay.classList.remove('is-visible');
      });
    }

    if (sidebarOverlay) {
      sidebarOverlay.addEventListener('click', () => {
        sidebar.classList.remove('is-open');
        sidebarOverlay.classList.remove('is-visible');
      });
    }

    // ---------- EDIT PRODUCT ----------
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists || userDoc.data().role !== 'admin') { 
          window.location.href = 'login.html'; 
          return; 
        }
        
        if (!productId) { window.location.href = 'products.html'; return; }
        
        const doc = await db.collection('Products').doc(productId).get();
        if (!doc.exists) { window.location.href = 'products.html'; return; }
        
        const p = doc.data();
        document.getElementById('name').value = p.name || '';
        document.getElementById('slug').value = p.slug || '';
        document.getElementById('price').value = ((p.salePrice || p.price) / 100).toFixed(2);
        document.getElementById('stock').value = p.stockCount || 0;
        
      } catch (err) {
        console.error('[admin/product-edit] Error:', err);
      }
    });

    document.getElementById('edit-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Updating...';
      
      try {
        await db.collection('Products').doc(productId).update({
          name: document.getElementById('name').value.trim(),
          slug: document.getElementById('slug').value.trim(),
          price: Math.round(parseFloat(document.getElementById('price').value) * 100),
          stockCount: parseInt(document.getElementById('stock').value) || 0,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        alert('Product updated!');
        window.location.href = 'products.html';
      } catch (err) {
        console.error('[admin/product-edit] Update error:', err);
        alert('Failed to update: ' + err.message);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Update Product';
      }
    });

    async function deleteProduct() {
      if (!confirm('Delete this product? This will deactivate it.')) return;
      
      try {
        await db.collection('Products').doc(productId).update({ isActive: false });
        alert('Product deactivated');
        window.location.href = 'products.html';
      } catch (err) {
        console.error('[admin/product-edit] Delete error:', err);
        alert('Failed to delete: ' + err.message);
      }
    }

    function logout() { 
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }
  </script>
</body>
</html>
