<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product — Woodbuyy Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <!-- Mobile menu button -->
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
    <i class="ri-menu-line"></i>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
        <i class="ri-close-line"></i>
      </button>
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html" class="active"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html"><i class="ri-folder-line"></i> Categories</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
      <a href="#" onclick="logout()" style="color:#E05555;"><i class="ri-logout-box-line"></i> Logout</a>
    </aside>

    <main class="main">
      <h1>Add Product</h1>

      <div class="card" style="padding:25px;max-width:600px;">
        <form id="product-form">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="name" required>
          </div>

          <div class="form-group">
            <label>Slug</label>
            <input type="text" id="slug" required>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="description" rows="4"></textarea>
          </div>

          <div class="form-group">
            <label>Price (AED)</label>
            <input type="number" id="price" step="0.01" min="0" required>
          </div>

          <div class="form-group">
            <label>Stock</label>
            <input type="number" id="stock" value="0" min="0">
          </div>

          <div class="form-group">
            <label>Category Slug</label>
            <input type="text" id="categorySlug" placeholder="sofas">
          </div>

          <div class="form-group">
            <label>Image URL</label>
            <input type="text" id="image" placeholder="https://...">
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="save-btn">
            Save Product
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script>
    // ---------- MOBILE MENU ----------
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarClose = document.getElementById('sidebarClose');

    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.add('is-open');
        sidebarOverlay.classList.add('is-visible');
      });
    }

    if (sidebarClose) {
      sidebarClose.addEventListener('click', () => {
        sidebar.classList.remove('is-open');
        sidebarOverlay.classList.remove('is-visible');
      });
    }

    if (sidebarOverlay) {
      sidebarOverlay.addEventListener('click', () => {
        sidebar.classList.remove('is-open');
        sidebarOverlay.classList.remove('is-visible');
      });
    }

    // ---------- ADD PRODUCT ----------
    document.getElementById('product-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const saveBtn = document.getElementById('save-btn');
      const price = Math.round(parseFloat(document.getElementById('price').value) * 100);
      const img = document.getElementById('image').value.trim();
      
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      
      try {
        await db.collection('Products').add({
          name: document.getElementById('name').value.trim(),
          slug: document.getElementById('slug').value.trim(),
          description: document.getElementById('description').value.trim(),
          price: price,
          stockCount: parseInt(document.getElementById('stock').value) || 0,
          categorySlug: document.getElementById('categorySlug').value.trim(),
          images: img ? [img] : [],
          isActive: true,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        alert('Product added successfully!');
        window.location.href = 'products.html';
      } catch (err) {
        console.error('[admin/product-new] Error:', err);
        alert('Failed to add product: ' + err.message);
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Product';
      }
    });

    // ---------- AUTH GUARD ----------
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists || userDoc.data().role !== 'admin') { 
          window.location.href = 'login.html'; 
          return; 
        }
      } catch (err) {
        console.error('[admin/product-new] Auth error:', err);
      }
    });

    function logout() { 
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    }
  </script>
</body>
</html>
