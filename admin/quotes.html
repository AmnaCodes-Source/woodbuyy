<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Quotes - Woodbuyy Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/global-layout.css">
</head>
<body>

  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
    <i class="ri-menu-line"></i>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
        <i class="ri-close-line"></i>
      </button>
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html"><i class="ri-folder-line"></i> Categories</a>
      <a href="attributes.html"><i class="ri-price-tag-3-line"></i> Attributes</a>
      <a href="quotes.html" class="active"><i class="ri-mail-send-line"></i> Custom Quotes</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
      <a href="#" onclick="logout()" style="color:#e05555;margin-top:auto;"><i class="ri-logout-box-line"></i> Logout</a>
    </aside>

    <main class="admin-main">
      <h1>Custom Quotes</h1>
      <p style="color:var(--color-text-mid);margin-bottom:24px;">Manage custom furniture requests from customers.</p>

      <div class="card">
        <div class="card__header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          <h2 style="font-family:var(--font-display);font-size:20px;margin:0;">All Requests</h2>
          <select class="input" id="statusFilter" style="max-width:200px;">
            <option value="">All Statuses</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="card__body" style="padding:0;">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Name</th>
                  <th>Contact</th>
                  <th>Details</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="quotesTbody">
                <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--color-text-muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/admin/admin-quotes.js"></script>
</body>
</html>
