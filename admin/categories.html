<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Woodbuyy Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body { font-family: 'Jost', sans-serif; background: #0D0D0D; color: #F5F0E8; margin: 0; }
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: #141414; border-right: 1px solid #2E2E2E; padding: 20px; position: fixed; top: 0; bottom: 0; }
    .sidebar .logo { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 24px; margin-bottom: 5px; }
    .sidebar .tag { font-size: 10px; letter-spacing: 2px; color: #C9A96E; text-transform: uppercase; margin-bottom: 30px; }
    .sidebar a { display: flex; align-items: center; gap: 10px; padding: 12px; color: #B0A898; text-decoration: none; font-size: 14px; border-radius: 4px; margin-bottom: 5px; }
    .sidebar a:hover, .sidebar a.active { background: #1C1C1C; color: #F5F0E8; }
    .main { flex: 1; margin-left: 250px; padding: 30px; position: relative; z-index: 1; }
    h1 { font-family: 'Cormorant Garamond', serif; }
    .form-group { margin-bottom: 12px; max-width: 400px; }
    label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6E6860; margin-bottom: 5px; }
    input { width: 100%; background: #141414; border: 1px solid #2E2E2E; border-radius: 4px; color: #F5F0E8; padding: 10px 12px; font-size: 14px; outline: none; }
    .btn-primary { padding: 12px 22px; background: #C9A96E; color: #0D0D0D; border: none; border-radius: 2px; font-size: 13px; font-weight: 500; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2E2E2E; font-size: 14px; }
    th { color: #6E6860; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    td { color: #B0A898; }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html" class="active"><i class="ri-folder-line"></i> Categories</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
    </aside>
    <main class="main">
      <h1>Categories</h1>
      <div class="form-group"><label>Category Name</label><input type="text" id="cat-name" placeholder="e.g. Sofas"></div>
      <div class="form-group"><label>Slug</label><input type="text" id="cat-slug" placeholder="e.g. sofas"></div>
      <button class="btn-primary" onclick="addCategory()">+ Add Category</button>
      <table>
        <thead><tr><th>Name</th><th>Slug</th><th>Status</th></tr></thead>
        <tbody id="categories-tbody"></tbody>
      </table>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      const userDoc = await db.collection('users').doc(user.uid).get();
      if (!userDoc.exists || userDoc.data().role !== 'admin') { window.location.href = 'login.html'; return; }
      loadCategories();
    });

    async function loadCategories() {
      const snap = await db.collection('categories').get();
      const tbody = document.getElementById('categories-tbody');
      if (snap.empty) { tbody.innerHTML = '<tr><td colspan="3">No categories yet.</td></tr>'; return; }
      tbody.innerHTML = snap.docs.map(doc => {
        const c = doc.data();
        return `<tr><td>${c.name}</td><td>${c.slug}</td><td>${c.isActive ? 'Active' : 'Inactive'}</td></tr>`;
      }).join('');
    }

    async function addCategory() {
      const name = document.getElementById('cat-name').value.trim();
      const slug = document.getElementById('cat-slug').value.trim();
      if (!name || !slug) { alert('Fill both fields'); return; }
      await db.collection('categories').add({ name, slug, level: 1, parentId: null, isActive: true, order: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      document.getElementById('cat-name').value = '';
      document.getElementById('cat-slug').value = '';
      loadCategories();
      alert('Category added!');
    }
  </script>
</body>
</html>
