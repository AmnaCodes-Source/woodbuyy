<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Woodbuyy Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
 <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="logo">Woodbuyy</div>
      <div class="tag">Admin Panel</div>
      <a href="index.html"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="products.html" class="active"><i class="ri-file-list-3-line"></i> Products</a>
      <a href="orders.html"><i class="ri-shopping-bag-line"></i> Orders</a>
      <a href="customers.html"><i class="ri-user-line"></i> Customers</a>
      <a href="categories.html"><i class="ri-folder-line"></i> Categories</a>
      <a href="settings.html"><i class="ri-settings-line"></i> Settings</a>
      <a href="#" onclick="logout()" style="color:#E05555;"><i class="ri-logout-box-line"></i> Logout</a>
    </aside>
    <main class="main">
      <h1>Products</h1>
      <a href="product-new.html" class="btn-primary">+ Add Product</a>
      <table>
        <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
        <tbody id="products-tbody"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </main>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      try {
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (!userDoc.exists || userDoc.data().role !== 'admin') { window.location.href = 'login.html'; return; }
        
        const snap = await db.collection('products').get();
        const tbody = document.getElementById('products-tbody');
        
        if (snap.empty) { tbody.innerHTML = '<tr><td colspan="4">No products yet.</td></tr>'; return; }
        
        tbody.innerHTML = snap.docs.map(doc => {
          const p = doc.data();
          const price = p.salePrice || p.price || 0;
          return `<tr><td>${p.name || '-'}</td><td>AED ${(price / 100).toFixed(2)}</td><td>${p.stockCount || 0}</td><td>${p.isActive ? 'Active' : 'Inactive'}</td></tr>`;
        }).join('');
      } catch (err) {
        console.error('Error:', err);
        document.getElementById('products-tbody').innerHTML = '<tr><td colspan="4">Error: ' + err.message + '</td></tr>';
      }
    });
    function logout() { auth.signOut(); window.location.href = 'login.html'; }
  </script>
</body>
</html>
