<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Woodbuyy</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="login-card">
    <div class="logo">Woodbuyy</div>
    <div class="tag">Admin Panel</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage your store</p>
    <form id="admin-login-form">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" class="input" required autocomplete="email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" class="input" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary btn--full" id="login-btn">Sign In</button>
      <div class="error" id="error-msg"></div>
    </form>
    <p style="text-align:center;margin-top:15px;font-size:13px;color:#6E6860;">
      <a href="forgot-password.html" style="color:#C9A96E;text-decoration:none;">Forgot password?</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.getElementById('login-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      errorMsg.style.display = 'none';
      
      // Validation
      if (!email || !password) {
        errorMsg.textContent = 'Please fill all fields';
        errorMsg.style.display = 'block';
        return;
      }
      
      // Loading state
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing In...';
      
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        const userDoc = await db.collection('users').doc(cred.user.uid).get();
        
        if (userDoc.exists && userDoc.data().role === 'admin') {
          window.location.href = 'index.html';
        } else {
          await auth.signOut();
          errorMsg.textContent = 'Access denied. Admin only.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        console.error('[admin/login] Error:', err);
        
        let message = 'Login failed. Please try again.';
        switch (err.code) {
          case 'auth/user-not-found':
            message = 'No account found with this email.';
            break;
          case 'auth/wrong-password':
            message = 'Incorrect password.';
            break;
          case 'auth/invalid-email':
            message = 'Invalid email address.';
            break;
          case 'auth/too-many-requests':
            message = 'Too many attempts. Please wait.';
            break;
          default:
            message = err.message;
        }
        
        errorMsg.textContent = message;
        errorMsg.style.display = 'block';
        
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
