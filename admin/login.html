<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Woodbuyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="login-card">
    <div class="logo">Woodbuyy</div>
    <div class="tag">Admin Panel</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage your store</p>
    <form id="admin-login-form">
      <div class="input-group"><label>Email</label><input type="email" id="email" required></div>
      <div class="input-group"><label>Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn">Sign In</button>
      <div class="error" id="error-msg"></div>
    </form>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.style.display = 'none';
      try {
        const cred = await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
        const userDoc = await db.collection('users').doc(cred.user.uid).get();
        if (userDoc.exists && userDoc.data().role === 'admin') {
          window.location.href = 'index.html';
        } else {
          await auth.signOut();
          errorMsg.textContent = 'Access denied. Admin only.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
