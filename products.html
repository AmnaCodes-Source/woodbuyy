<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Furniture — Woodbuyy UAE | Sofas, Beds, Tables, Wardrobes</title>
  <meta name="description" content="Browse all furniture at Woodbuyy. Premium sofas, beds, dining tables, wardrobes & more. Cash on delivery across UAE. 5% VAT included.">
  <meta name="keywords" content="furniture shop UAE, buy furniture online, sofas, beds, tables, wardrobes, COD furniture Dubai">
  <meta property="og:title" content="Shop All Furniture — Woodbuyy UAE">
  <meta property="og:description" content="Browse premium furniture collection. Cash on delivery across UAE.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://amnacodes-source.github.io/woodbuyy/products.html">
  <meta name="robots" content="index, follow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container navbar__inner">
      <button class="navbar__toggle" id="navbar-toggle" aria-label="Menu"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="categories.html" class="navbar__link">Categories</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="contact.html" class="navbar__link">Contact</a>
        <a href="custom-quote.html" class="navbar__link">Custom Quote</a>
      </nav>
      <div class="navbar__actions">
        <a href="account-wishlist.html" class="navbar__icon" aria-label="Wishlist">
          <i class="ri-heart-line"></i>
          <span class="navbar__badge hidden" data-wishlist-count>0</span>
        </a>
        <a href="cart.html" class="navbar__icon" aria-label="Cart">
          <i class="ri-shopping-bag-line"></i>
          <span class="navbar__badge hidden" data-cart-count>0</span>
        </a>
        <a href="account.html" class="navbar__icon" aria-label="Account"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <main class="products-page">
    <div class="products-header">
      <h1>All Furniture</h1>

      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="Search sofas, beds, tables..." autocomplete="off">
        <i class="ri-close-line search-clear" id="search-clear"></i>
        <i class="ri-search-line search-icon"></i>
      </div>
      <p class="search-info" id="search-info"></p>
    </div>

    <div class="products-grid" id="grid"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer__brand">Woodbuyy</p>
      <p class="footer__tagline">Luxury furniture for the modern UAE home.</p>
      <p class="footer__copyright">© 2026 Woodbuyy. All rights reserved.</p>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="js/firebase-config.js"></script>

  <!-- UI Helpers -->
  <script src="js/ui.js"></script>

  <!-- Cart System -->
  <script src="js/cart.js"></script>

  <!-- Wishlist System -->
  <script src="js/wishlist.js"></script>

  <!-- Page Script -->
  <script>
    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    const searchInfo = document.getElementById('search-info');

    let allProducts = [];
    let searchTimeout = null;

    // Render products to grid
    function renderProducts(products) {
      if (products.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <i class="ri-search-line"></i>
            <p>No products found</p>
            <span>Try a different search term</span>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(doc => {
        const p = doc.data ? doc.data() : doc;
        const id = doc.id || p.id;
        const price = p.price || 0;
        const salePrice = p.salePrice || null;
        const displayPrice = salePrice || price;
        const hasSale = salePrice && salePrice < price;
        const image = (p.images && p.images[0]) ? p.images[0] : 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600';
        const category = p.categorySlug || p.category || '';
        return `
          <a href="product.html?id=${id}" class="product-card">
            <img src="${image}" alt="${escapeHTML(p.name || '')}" loading="lazy">
            <div class="product-card__body">
              ${category ? `<p class="product-card__category">${escapeHTML(category)}</p>` : ''}
              <p class="product-card__name">${escapeHTML(p.name || '-')}</p>
              <p class="product-card__price">
                ${formatCurrency(displayPrice)}
                ${hasSale ? `<span style="text-decoration:line-through;color:#6E6860;font-size:14px;">${formatCurrency(price)}</span>` : ''}
              </p>
            </div>
          </a>
        `;
      }).join('');
    }

    // Show skeleton loaders
    function showSkeletons(count = 8) {
      grid.innerHTML = Array(count).fill(`
        <div class="skeleton skeleton-card"></div>
      `).join('');
    }

    // Filter products by search term
    function filterProducts(searchTerm) {
      const term = searchTerm.toLowerCase().trim();

      if (!term) {
        searchInfo.classList.remove('is-visible');
        searchClear.classList.remove('is-visible');
        renderProducts(allProducts);
        return;
      }

      searchClear.classList.add('is-visible');

      const filtered = allProducts.filter(p => {
        const data = p.data ? p.data() : p;
        const name = (data.name || '').toLowerCase();
        const category = (data.categorySlug || data.category || '').toLowerCase();
        const description = (data.description || '').toLowerCase();
        return name.includes(term) || category.includes(term) || description.includes(term);
      });

      searchInfo.textContent = `${filtered.length} result${filtered.length !== 1 ? 's' : ''} for "${searchTerm}"`;
      searchInfo.classList.add('is-visible');
      renderProducts(filtered);
    }

    // Load all products from Firestore
    async function loadProducts() {
      showSkeletons(8);
      try {
        const snap = await db.collection('Products')
          .where('isActive', '==', true)
          .orderBy('createdAt', 'desc')
          .get();
        allProducts = snap.docs;
        renderProducts(allProducts);
      } catch (err) {
        console.error('[products.html] Error loading products:', err);
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <i class="ri-error-warning-line"></i>
            <p>Error loading products</p>
            <span>Please try again later</span>
          </div>
        `;
      }
    }

    // Search input handler (debounced)
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        filterProducts(e.target.value);
      }, 300);
    });

    // Clear search
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      filterProducts('');
      searchInput.focus();
    });

    // Escape key clears search
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        filterProducts('');
      }
    });

    // Load products on page load
    loadProducts();
  </script>

</body>
</html>
