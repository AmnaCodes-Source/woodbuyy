<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Furniture — Woodbuyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body { background: #0D0D0D; font-family: 'Jost', sans-serif; margin: 0; }
    .products-page { padding-top: 72px; min-height: 100vh; }
    .products-header { padding: 40px 0 20px; text-align: center; }
    .products-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px 25px 60px; max-width: 1200px; margin: 0 auto; }
    .product-card { background: #1C1C1C; border: 1px solid #2E2E2E; border-radius: 4px; overflow: hidden; text-decoration: none; display: block; }
    .product-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; }
    .product-card__body { padding: 18px; }
    .product-card__name { font-family: 'Cormorant Garamond', serif; font-size: 19px; color: #F5F0E8; margin-bottom: 8px; }
    .product-card__price { font-size: 16px; font-weight: 500; color: #C9A96E; }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <main class="products-page">
    <div class="products-header">
      <h1 style="font-family:'Cormorant Garamond',serif;color:#F5F0E8;">All Furniture</h1>
    </div>
    <div class="products-grid" id="grid"><p style="color:#6E6860;text-align:center;">Loading...</p></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    async function load() {
      try {
        const snap = await db.collection('products').get();
        const grid = document.getElementById('grid');
        if (snap.empty) {
          grid.innerHTML = '<p style="text-align:center;color:#6E6860;">No products yet.</p>';
          return;
        }
        grid.innerHTML = snap.docs.map(doc => {
          const p = doc.data();
          const price = p.price || 0;
          return `<a href="product.html?id=${doc.id}" class="product-card">
            <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600" alt="${p.name || ''}">
            <div class="product-card__body">
              <p class="product-card__name">${p.name || '-'}</p>
              <p class="product-card__price">AED ${(price / 100).toFixed(2)}</p>
            </div>
          </a>`;
        }).join('');
      } catch (err) {
        document.getElementById('grid').innerHTML = '<p style="text-align:center;color:#E05555;">Error: ' + err.message + '</p>';
      }
    }
    load();
  </script>
</body>
</html>
