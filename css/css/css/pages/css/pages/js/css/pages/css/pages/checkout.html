<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Woodbuyy</title>
  <meta name="description" content="Checkout at Woodbuyy. Cash on delivery across UAE.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/checkout.css">
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <header class="navbar">
    <div class="container">
      <div class="navbar__inner">
        <a href="/" class="navbar__logo">Woodbuyy</a>
        <div class="navbar__actions">
          <button class="navbar__action-btn" aria-label="Cart">
            <i class="ri-shopping-bag-line"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ========== PAGE HEADER ========== -->
  <section class="page-header">
    <div class="container">
      <h1 class="page-header__title">Checkout</h1>
      <p class="page-header__subtitle">Complete your order with Cash on Delivery</p>
    </div>
  </section>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="section section--sm">
    <div class="container">
      
      <div class="checkout-layout">
        
        <!-- LEFT: Form -->
        <div class="checkout-form">
          
          <!-- Customer Info -->
          <div class="form-section">
            <h2 class="form-section__title">Customer Information</h2>
            <div class="form-row form-row--two">
              <div class="input-group">
                <label class="input-label" for="fullName">Full Name *</label>
                <input class="input" type="text" id="fullName" placeholder="Your full name" required>
              </div>
              <div class="input-group">
                <label class="input-label" for="phone">Phone Number *</label>
                <input class="input" type="tel" id="phone" placeholder="+971 5X XXX XXXX" required>
              </div>
            </div>
            <div class="form-row">
              <div class="input-group">
                <label class="input-label" for="email">Email Address *</label>
                <input class="input" type="email" id="email" placeholder="you@example.com" required>
              </div>
            </div>
          </div>

          <!-- Delivery Address -->
          <div class="form-section">
            <h2 class="form-section__title">Delivery Address</h2>
            <div class="form-row">
              <div class="input-group">
                <label class="input-label" for="addressLine1">Address Line 1 *</label>
                <input class="input" type="text" id="addressLine1" placeholder="Building, Street" required>
              </div>
            </div>
            <div class="form-row">
              <div class="input-group">
                <label class="input-label" for="addressLine2">Address Line 2</label>
                <input class="input" type="text" id="addressLine2" placeholder="Apartment, Floor (optional)">
              </div>
            </div>
            <div class="form-row form-row--two">
              <div class="input-group">
                <label class="input-label" for="emirate">Emirate *</label>
                <select class="input" id="emirate" required>
                  <option value="">Select Emirate</option>
                  <option value="Dubai">Dubai</option>
                  <option value="Abu Dhabi">Abu Dhabi</option>
                  <option value="Sharjah">Sharjah</option>
                  <option value="Ajman">Ajman</option>
                  <option value="Ras Al Khaimah">Ras Al Khaimah</option>
                  <option value="Fujairah">Fujairah</option>
                  <option value="Umm Al Quwain">Umm Al Quwain</option>
                </select>
              </div>
              <div class="input-group">
                <label class="input-label" for="city">City *</label>
                <input class="input" type="text" id="city" placeholder="City" required>
              </div>
            </div>
          </div>

          <!-- Payment -->
          <div class="form-section">
            <h2 class="form-section__title">Payment Method</h2>
            <div class="payment-method">
              <i class="ri-cash-line payment-method__icon"></i>
              <div>
                <p class="payment-method__label">Cash on Delivery</p>
                <p class="payment-method__desc">Pay when your order arrives</p>
              </div>
            </div>
          </div>

        </div>

        <!-- RIGHT: Summary -->
        <div class="checkout-summary" id="checkoutSummary">
          <!-- Summary renders here -->
        </div>

      </div>

    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- JS -->
  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/ui.js"></script>
  <script type="module" src="/js/cart.js"></script>
  <script type="module" src="/js/orders.js"></script>

  <script type="module">
    import { getCartItems, getCartSubtotal, clearCart } from '/js/cart.js';
    import { formatAED, showToast, setButtonLoading, handleError } from '/js/ui.js';
    import { createOrder } from '/js/orders.js';

    // Render summary
    function renderSummary() {
      const items = getCartItems();
      const summary = document.getElementById('checkoutSummary');
      
      if (items.length === 0) {
        summary.innerHTML = `
          <div class="empty-state">
            <i class="ri-shopping-bag-line empty-state__icon"></i>
            <h3 class="empty-state__title">Cart is empty</h3>
            <a href="/products.html" class="btn btn--primary btn--sm">Shop Now</a>
          </div>
        `;
        return;
      }

      const subtotal = getCartSubtotal();
      const vat = Math.round(subtotal * 0.05);
      const shipping = 0; // Will be calculated based on emirate
      const total = subtotal + vat + shipping;

      const itemsHTML = items.map(item => {
        const price = item.salePrice || item.price;
        return `
          <div class="checkout-summary__item">
            <img class="checkout-summary__item-image" src="${item.image}" alt="${item.name}">
            <span class="checkout-summary__item-name">${item.name}</span>
            <span class="checkout-summary__item-qty">×${item.quantity}</span>
            <span class="checkout-summary__item-price">${formatAED(price * item.quantity)}</span>
          </div>
        `;
      }).join('');

      summary.innerHTML = `
        <h2 class="checkout-summary__title">Order Summary</h2>
        <div class="checkout-summary__items">${itemsHTML}</div>
        <div class="checkout-summary__row">
          <span>Subtotal</span>
          <span>${formatAED(subtotal)}</span>
        </div>
        <div class="checkout-summary__row">
          <span>VAT (5%)</span>
          <span>${formatAED(vat)}</span>
        </div>
        <div class="checkout-summary__row">
          <span>Shipping</span>
          <span id="shippingCost">${formatAED(shipping)}</span>
        </div>
        <div class="checkout-summary__row checkout-summary__row--total">
          <span>Total (COD)</span>
          <span class="checkout-summary__total-value">${formatAED(total)}</span>
        </div>
        <button class="btn btn--primary btn--full" id="placeOrderBtn" style="margin-top: var(--space-6);">
          <i class="ri-check-line"></i>
          Place Order
        </button>
      `;

      document.getElementById('placeOrderBtn')?.addEventListener('click', placeOrder);
    }

    // Place order
    async function placeOrder() {
      const btn = document.getElementById('placeOrderBtn');
      
      // Validate
      const fullName = document.getElementById('fullName')?.value.trim();
      const phone = document.getElementById('phone')?.value.trim();
      const email = document.getElementById('email')?.value.trim();
      const addressLine1 = document.getElementById('addressLine1')?.value.trim();
      const addressLine2 = document.getElementById('addressLine2')?.value.trim() || '';
      const emirate = document.getElementById('emirate')?.value;
      const city = document.getElementById('city')?.value.trim();

      if (!fullName || !phone || !email || !addressLine1 || !emirate || !city) {
        showToast('Please fill all required fields', 'warning');
        return;
      }

      if (!email.includes('@')) {
        showToast('Please enter a valid email', 'warning');
        return;
      }

      setButtonLoading(btn, true, 'Placing Order...');

      try {
        const items = getCartItems();
        const subtotal = getCartSubtotal();
        const vat = Math.round(subtotal * 0.05);
        const shipping = 0;
        const total = subtotal + vat + shipping;

        const orderData = {
          customerName: fullName,
          customerEmail: email,
          customerPhone: phone,
          items,
          subtotal,
          vat,
          shipping,
          total,
          address: {
            line1: addressLine1,
            line2: addressLine2,
            emirate,
            city,
            country: 'UAE'
          },
          paymentMethod: 'cod',
          status: 'pending'
        };

        const orderId = await createOrder(orderData);
        
        await clearCart();
        window.location.href = `/order-success.html?orderId=${orderId}`;
      } catch (error) {
        handleError(error, 'Failed to place order. Please try again.');
        setButtonLoading(btn, false);
      }
    }

    // Init
    renderSummary();
  </script>

</body>
</html>
