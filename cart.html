<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Woodbuyy UAE | Cash on Delivery Furniture</title>
  <meta name="description" content="Review your cart at Woodbuyy. Cash on delivery across all 7 Emirates. 5% VAT included. Premium furniture delivered to your door.">
  <meta name="keywords" content="cart, furniture cart UAE, COD furniture, buy furniture Dubai">
  <meta property="og:title" content="Your Cart — Woodbuyy UAE">
  <meta property="og:description" content="Review your cart. Cash on delivery across UAE.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://amnacodes-source.github.io/woodbuyy/cart.html">
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar__inner">
      <button class="navbar__toggle" id="navbar-toggle" aria-label="Menu"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="categories.html" class="navbar__link">Categories</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="contact.html" class="navbar__link">Contact</a>
        <a href="custom-quote.html" class="navbar__link">Custom Quote</a>
      </nav>
      <div class="navbar__actions">
        <a href="account-wishlist.html" class="navbar__icon" aria-label="Wishlist">
          <i class="ri-heart-line"></i>
          <span class="navbar__badge hidden" data-wishlist-count>0</span>
        </a>
        <a href="cart.html" class="navbar__icon" aria-label="Cart">
          <i class="ri-shopping-bag-line"></i>
          <span class="navbar__badge hidden" data-cart-count>0</span>
        </a>
        <a href="account.html" class="navbar__icon" aria-label="Account"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <main class="cart-page">
    <div class="container">
      <div class="cart-header">
        <p class="section-eyebrow">Your Selection</p>
        <h1 class="section-title">Shopping Cart</h1>
      </div>
      <div class="cart-layout" id="cart-layout">
        <!-- Cart items render here -->
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__brand">Woodbuyy</p>
      <p class="footer__tagline">Luxury furniture for the modern UAE home.</p>
      <p class="footer__copyright">© 2026 Woodbuyy. All rights reserved.</p>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="js/firebase-config.js"></script>

  <!-- UI Helpers -->
  <script src="js/ui.js"></script>

  <!-- Cart System -->
  <script src="js/cart.js"></script>

  <!-- Wishlist System -->
  <script src="js/wishlist.js"></script>

  <!-- Page Script -->
  <script>
    const layout = document.getElementById('cart-layout');

    function renderCartPage() {
      const cart = getCartItems();

      if (cart.length === 0) {
        layout.innerHTML = `
          <div class="empty-state" style="grid-column: 1/-1;">
            <div class="empty-state__icon">
              <i class="ri-shopping-bag-line"></i>
            </div>
            <h3 class="empty-state__title">Your cart is empty</h3>
            <p class="empty-state__text">Browse our collection and add furniture you love.</p>
            <a href="products.html" class="btn btn--primary">Start Shopping</a>
          </div>
        `;
        return;
      }

      const subtotal = getCartSubtotal();
      const vat = Math.round(subtotal * 0.05);
      const total = subtotal + vat;

      layout.innerHTML = `
        <div class="cart-items">
          ${cart.map((item, index) => {
            const price = item.salePrice || item.price;
            return `
              <div class="cart-item">
                <img src="${item.image || 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=200'}" alt="${escapeHTML(item.name)}" loading="lazy">
                <div class="cart-item__info">
                  <p class="cart-item__name">${escapeHTML(item.name)}</p>
                  <p class="cart-item__price">${formatCurrency(price)}</p>
                </div>
                <div class="cart-item__qty">
                  <button onclick="updateCartQty(${index}, -1)" aria-label="Decrease quantity">−</button>
                  <span>${item.quantity}</span>
                  <button onclick="updateCartQty(${index}, 1)" aria-label="Increase quantity">+</button>
                </div>
                <button class="cart-item__remove" onclick="removeCartItem(${index})" aria-label="Remove item">
                  <i class="ri-delete-bin-line"></i>
                </button>
              </div>
            `;
          }).join('')}
        </div>
        <div class="cart-summary">
          <div class="cart-summary__row">
            <span>Subtotal</span>
            <span>${formatCurrency(subtotal)}</span>
          </div>
          <div class="cart-summary__row">
            <span>VAT (5%)</span>
            <span>${formatCurrency(vat)}</span>
          </div>
          <div class="cart-summary__row cart-summary__row--total">
            <span>Total</span>
            <span>${formatCurrency(total)}</span>
          </div>
          <a href="checkout.html" class="btn btn--primary btn--full" style="margin-top:20px;">
            Proceed to Checkout
          </a>
          <a href="products.html" class="btn btn--ghost btn--full" style="margin-top:10px;">
            Continue Shopping
          </a>
        </div>
      `;
    }

    window.updateCartQty = (index, delta) => {
      const cart = getCartItems();
      const item = cart[index];
      if (!item) return;
      
      const newQty = item.quantity + delta;
      if (newQty <= 0) {
        removeFromCart(item.productId);
      } else {
        updateQuantity(item.productId, newQty);
      }
      renderCartPage();
    };

    window.removeCartItem = (index) => {
      const cart = getCartItems();
      const item = cart[index];
      if (!item) return;
      
      removeFromCart(item.productId);
      renderCartPage();
    };

    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    renderCartPage();
  </script>

</body>
</html>
