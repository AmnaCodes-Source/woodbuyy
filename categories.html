<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Woodbuyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .categories-page { padding-top: 72px; min-height: 100vh; }
    .categories-header { padding: 40px 0 20px; text-align: center; }
    .categories-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px 0 60px; }
    .category-card { position: relative; border-radius: 4px; overflow: hidden; aspect-ratio: 4/3; text-decoration: none; display: block; }
    .category-card img { width: 100%; height: 100%; object-fit: cover; }
    .category-card__overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,13,13,0.85), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
    .category-card__title { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: #F5F0E8; }
    @media (min-width: 768px) { .categories-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .categories-grid { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar__inner">
      <button class="navbar__toggle"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="categories.html" class="navbar__link">Categories</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="contact.html" class="navbar__link">Contact</a>
      </nav>
      <div class="navbar__actions">
        <a href="account-wishlist.html" class="navbar__icon"><i class="ri-heart-line"></i></a>
        <a href="cart.html" class="navbar__icon"><i class="ri-shopping-bag-line"></i><span class="navbar__badge hidden" id="cart-count">0</span></a>
        <a href="account.html" class="navbar__icon"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <main class="categories-page">
    <div class="container">
      <div class="categories-header">
        <p style="font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#C9A96E;">Explore</p>
        <h1 style="font-family:'Cormorant Garamond',serif;font-size:36px;color:#F5F0E8;margin-top:10px;">All Categories</h1>
      </div>
      <div class="categories-grid" id="categories-grid">
        <!-- Categories load honge Firebase se -->
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const grid = document.getElementById('categories-grid');
    const images = {
      sofas: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600',
      beds: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600',
      tables: 'https://images.unsplash.com/photo-1532372320572-cda25653a26d?w=600',
      wardrobes: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=600',
      chairs: 'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=600',
      default: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600'
    };

    async function loadCategories() {
      try {
      const snap = await db.collection('categories').get();

        if (snap.empty) {
          grid.innerHTML = '<p style="text-align:center;color:#6E6860;padding:60px 0;">No categories yet. Add from admin panel.</p>';
          return;
        }

        grid.innerHTML = snap.docs.map(doc => {
          const c = doc.data();
          const img = c.image || images[c.slug] || images.default;
          return `
            <a href="category.html?slug=${c.slug}" class="category-card">
              <img src="${img}" alt="${c.name}" onerror="this.src='${images.default}'">
              <div class="category-card__overlay">
                <p class="category-card__title">${c.name}</p>
              </div>
            </a>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = '<p style="text-align:center;color:#E05555;">Failed to load categories.</p>';
      }
    }

    loadCategories();
  </script>

</body>
</html>
