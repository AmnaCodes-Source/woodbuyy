<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Woodbuyy UAE | Sofas, Beds, Tables, Wardrobes</title>
  <meta name="description" content="Browse furniture categories at Woodbuyy. Sofas, beds, dining tables, wardrobes, chairs & more. Cash on delivery across UAE.">
  <meta name="robots" content="index, follow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar__inner">
      <button class="navbar__toggle" id="navbar-toggle" aria-label="Menu"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="categories.html" class="navbar__link">Categories</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="contact.html" class="navbar__link">Contact</a>
        <a href="custom-quote.html" class="navbar__link">Custom Quote</a>
      </nav>
      <div class="navbar__actions">
        <a href="account-wishlist.html" class="navbar__icon" aria-label="Wishlist">
          <i class="ri-heart-line"></i>
          <span class="navbar__badge hidden" data-wishlist-count>0</span>
        </a>
        <a href="cart.html" class="navbar__icon" aria-label="Cart">
          <i class="ri-shopping-bag-line"></i>
          <span class="navbar__badge hidden" data-cart-count>0</span>
        </a>
        <a href="account.html" class="navbar__icon" aria-label="Account"><i class="ri-user-line"></i></a>
      </div>
    </div>
  </header>

  <main class="categories-page">
    <div class="container">
      <div class="categories-header">
        <p class="section-eyebrow">Explore</p>
        <h1 class="section-title">All Categories</h1>
      </div>
      <div class="categories-grid" id="categories-grid">
        <div class="skeleton" style="aspect-ratio:4/3;"></div>
        <div class="skeleton" style="aspect-ratio:4/3;"></div>
        <div class="skeleton" style="aspect-ratio:4/3;"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__brand">Woodbuyy</p>
      <p class="footer__tagline">Luxury furniture for the modern UAE home.</p>
      <p class="footer__copyright">© 2026 Woodbuyy. All rights reserved.</p>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="js/firebase-config.js"></script>

  <!-- UI Helpers -->
  <script src="js/ui.js"></script>

  <!-- Cart System -->
  <script src="js/cart.js"></script>

  <!-- Wishlist System -->
  <script src="js/wishlist.js"></script>

  <!-- Page Script -->
  <script>
    const grid = document.getElementById('categories-grid');
    const images = {
      sofas: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600',
      beds: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600',
      tables: 'https://images.unsplash.com/photo-1532372320572-cda25653a26d?w=600',
      wardrobes: 'https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=600',
      chairs: 'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=600',
      default: 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600'
    };

    async function loadCategories() {
      try {
        const snap = await db.collection('categories')
          .where('isActive', '==', true)
          .orderBy('order', 'asc')
          .get();

        if (snap.empty) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <div class="empty-state__icon">
                <i class="ri-grid-line"></i>
              </div>
              <h3 class="empty-state__title">No categories yet</h3>
              <p class="empty-state__text">Categories will appear here once added.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = snap.docs.map(doc => {
          const c = doc.data();
          const img = c.image || images[c.slug] || images.default;
          return `
            <a href="category.html?slug=${c.slug}" class="category-card">
              <img src="${img}" alt="${escapeHTML(c.name)}" loading="lazy" onerror="this.src='${images.default}'">
              <div class="category-card__overlay">
                <p class="category-card__title">${escapeHTML(c.name)}</p>
              </div>
            </a>
          `;
        }).join('');
      } catch (err) {
        console.error('[categories.html] Error:', err);
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <div class="empty-state__icon">
              <i class="ri-error-warning-line"></i>
            </div>
            <h3 class="empty-state__title">Failed to load categories</h3>
            <p class="empty-state__text">Please try again later.</p>
          </div>
        `;
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    loadCategories();
  </script>

</body>
</html>
