<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woodbuyy - Custom Made Furniture in Dubai</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>

  <!-- Custom Navbar (No components.css to conflict) -->
  <header style="background: var(--color-bg); border-bottom: 1px solid var(--color-border-light);">
    
    <!-- Logo Row -->
    <div style="display: flex; align-items: center; justify-content: center; position: relative; padding: 24px 40px;">
      <a href="/" style="font-size: 48px; font-family: var(--font-display); font-weight: 700; color: var(--color-text); text-decoration: none; letter-spacing: -1px; line-height: 1;">Woodbuyy</a>
      
      <div style="position: absolute; right: 40px; display: flex; gap: 20px;">
        <a href="/cart.html" style="color: var(--color-text); font-size: 22px; text-decoration: none;"><i class="ri-shopping-bag-line"></i></a>
        <a href="/account.html" style="color: var(--color-text); font-size: 22px; text-decoration: none;"><i class="ri-user-line"></i></a>
      </div>
    </div>

    <!-- Links Row -->
    <nav style="display: flex; justify-content: center; flex-wrap: wrap; gap: 30px; padding: 16px 40px; font-family: var(--font-body); font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; border-top: 1px solid var(--color-border-light);">
      <a href="/" style="color: var(--color-text-mid); text-decoration: none;">Home</a>
      <a href="/products.html" style="color: var(--color-text-mid); text-decoration: none;">Shop Online</a>
      <a href="/category.html?slug=indoor" style="color: var(--color-text-mid); text-decoration: none;">Indoor</a>
      <a href="/category.html?slug=outdoor" style="color: var(--color-text-mid); text-decoration: none;">Outdoor</a>
      <a href="/products.html?sale=true" style="color: var(--color-text-mid); text-decoration: none;">Sale</a>
      <a href="/contact.html" style="color: var(--color-text-mid); text-decoration: none;">Contact</a>
      <a href="/about.html" style="color: var(--color-text-mid); text-decoration: none;">About</a>
    </nav>

  </header>

  <!-- Hero Section -->
  <section style="text-align: center; padding: 80px 20px; background-color: var(--color-bg);">
    <div style="max-width: 900px; margin: 0 auto;">
      <h1 style="font-family: var(--font-display); font-size: 56px; font-weight: 600; color: var(--color-text); margin-bottom: 24px; line-height: 1.1;">
        Custom Made Furniture in Dubai
      </h1>
      <p style="font-family: var(--font-body); font-size: 16px; color: var(--color-text-mid); line-height: 1.8;">
        Sofas, beds, dining tables, wardrobes, media walls, and outdoor furniture. Made to your size in our own workshop. Delivered across the UAE.
      </p>
    </div>
  </section>

  <!-- Category Grid -->
  <section style="padding-bottom: 80px; background-color: var(--color-bg);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 0 40px;">
      <div class="category-grid" id="categoryGrid">
        <!-- Loaded via JS -->
      </div>
    </div>
  </section>

  <footer id="footer"></footer>
  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/home.js"></script>

</body>
</html>
