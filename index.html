<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woodbuyy - Custom Made Furniture in Dubai</title>
  <meta name="description" content="Premium furniture, delivered across the UAE. Cash on delivery.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="/css/global-layout.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body>

  <main>
    <!-- Hero Section -->
    <section class="hero-section" style="text-align: center; padding: 100px 20px 80px; background-color: var(--color-bg);">
      <div class="container" style="max-width: 900px; margin: 0 auto;">
        <h1 style="font-family: var(--font-display); font-size: 64px; font-weight: 600; color: var(--color-text); margin-bottom: 24px; line-height: 1.1;">Custom Made Furniture in Dubai</h1>
        <p style="font-family: var(--font-body); font-size: 18px; color: var(--color-text-mid); line-height: 1.8;">
          Sofas, beds, dining tables, wardrobes, media walls, and outdoor furniture. Made to your size in our own workshop. Delivered across the UAE.
        </p>
      </div>
    </section>

    <!-- Category Grid -->
    <section class="category-section" style="padding-bottom: 80px;">
      <div class="container">
        <div class="category-grid" id="categoryGrid"></div>
      </div>
    </section>
  </main>

  <div id="toast-container"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/global-layout.js"></script>
  <script src="/js/home.js"></script>

</body>
</html>
