<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Woodbuyy</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/WOODBUYY_BRAND.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .contact-page { padding-top: 72px; min-height: 100vh; }
    .contact-content { max-width: 600px; margin: 0 auto; padding: 50px 20px; }
    .contact-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; color: #F5F0E8; margin-bottom: 10px; text-align: center; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #6E6860; margin-bottom: 6px; }
    .input-group input, .input-group textarea { width: 100%; background: #141414; border: 1px solid #2E2E2E; border-radius: 4px; color: #F5F0E8; padding: 12px; font-size: 14px; outline: none; }
    .input-group textarea { min-height: 120px; resize: vertical; }
    .btn-primary { width: 100%; height: 48px; background: #C9A96E; color: #0D0D0D; border: none; border-radius: 2px; font-size: 14px; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar__inner">
      <button class="navbar__toggle"><i class="ri-menu-line"></i></button>
      <a href="index.html" class="navbar__logo">Woodbuyy</a>
      <nav class="navbar__nav">
        <a href="products.html" class="navbar__link">Shop All</a>
        <a href="categories.html" class="navbar__link">Categories</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="contact.html" class="navbar__link">Contact</a>
      </nav>
      <div class="navbar__actions">
        <a href="cart.html" class="navbar__icon"><i class="ri-shopping-bag-line"></i></a>
      </div>
    </div>
  </header>

  <main class="contact-page">
    <div class="contact-content">
      <p style="font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#C9A96E;text-align:center;">Get In Touch</p>
      <h1 class="contact-title">Contact Us</h1>
      <form id="contact-form" style="margin-top:25px;">
        <div class="input-group">
          <label>Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="input-group">
          <label>Subject</label>
          <input type="text" id="subject" required>
        </div>
        <div class="input-group">
          <label>Message</label>
          <textarea id="message" required></textarea>
        </div>
        <button type="submit" class="btn-primary">Send Message</button>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      try {
        await db.collection('supportTickets').add({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          subject: document.getElementById('subject').value,
          message: document.getElementById('message').value,
          status: 'open',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('Message sent!');
        this.reset();
      } catch (err) {
        alert('Failed to send: ' + err.message);
      }
    });
  </script>

</body>
</html>
